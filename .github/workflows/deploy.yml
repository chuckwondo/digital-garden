name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; let an in-progress run finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the created/modified-date plugin can read git dates

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version # 22.16.0 -> npm 10.9.2, satisfying engine-strict
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz community plugins
        run: npm run install-plugins # populates .quartz/ (gitignored), required before build

      - name: Build site
        run: npx quartz build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
